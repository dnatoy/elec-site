name: Deploy to S3

on:
  push:
    branches: [main]

# Required for OIDC — lets GitHub request a short-lived AWS token,
# no stored access keys anywhere.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::061688137970:role/GitHub_Upload_to_S3
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://mdpelectrical.com \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1B0D7J9NBXNBW \
            --paths "/*"
